<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GnostrKey Self-Test</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --text: #e2e8f0;
            --muted: #94a3b8;
            --accent: #38bdf8;
            --pass: #22c55e;
            --fail: #ef4444;
            --warn: #f59e0b;
            --border: #334155;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }
        h1 { margin: 0 0 8px; font-size: 1.75rem; }
        .subtitle { color: var(--muted); margin-bottom: 24px; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        section {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
        }
        h2 {
            margin: 0 0 12px;
            font-size: 1.1rem;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .summary {
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .summary.pass { background: rgba(34, 197, 94, 0.15); color: var(--pass); }
        .summary.fail { background: rgba(239, 68, 68, 0.15); color: var(--fail); }
        .result {
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.9rem;
        }
        .result.pass { background: rgba(34, 197, 94, 0.1); color: var(--pass); }
        .result.fail { background: rgba(239, 68, 68, 0.1); color: var(--fail); }
        .error-detail {
            margin: 6px 0 0;
            padding: 8px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 4px;
            white-space: pre-wrap;
            font-size: 0.8rem;
            color: #fca5a5;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th, td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--muted); font-weight: 600; }
        .good { color: var(--pass); }
        .warn { color: var(--warn); }
        .poor { color: var(--fail); }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        button {
            background: var(--accent);
            color: #0f172a;
            border: none;
            border-radius: 6px;
            padding: 8px 14px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.1); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        input[type="text"] {
            flex: 1;
            min-width: 140px;
            background: #0f172a;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
        }
        .metric {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 8px;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .metric label { color: var(--muted); }
        .metric pre, .metric .value {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-all;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .log, .messages {
            max-height: 240px;
            overflow: auto;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
        }
        .log-line { margin-bottom: 4px; }
        .log-line.warn { color: var(--warn); }
        .log-line.error { color: var(--fail); }
        .muted { color: var(--muted); }
        ul { margin: 0; padding-left: 20px; }
        li { margin-bottom: 4px; }
    </style>
</head>

            <div id="test-results"></div>

                <button id="btn-ping" type="button">Ping all peers</button>

            <div class="controls">

            <div class="metric">
                <label>Peer ID</label>
                <div id="peer-id" class="value">—</div>

            <div class="metric">

                <pre id="listen-addrs">—</pre>
            </div>
            <div class="metric">
                <label>Connections</label>
                <div id="connection-count" class="value">0</div>

            <div class="metric">

                <pre id="pubsub-peers">—</pre>
            </div>
            <div class="metric">
                <label>Attestation</label>
                <div id="attestation-id" class="value muted">—</div>
            </div>
            <div class="metric">
                <label>Active npub</label>
                <div id="active-npub" class="value muted">—</div>
            </div>

            <h3>Page instances</h3>
            <ul id="page-instances">
                <li class="muted">No other tabs detected yet</li>
            </ul>

            <h3>Received messages</h3>
            <div id="received-messages" class="messages"></div>
        </section>

        <section>
            <h2>Node Log</h2>
            <div id="node-log" class="log"></div>
        </section>
    </div>
